name: 自動產生文件目錄

on:
  push:
    paths:
      - 'document/**'        # 只有 document 資料夾有變動才觸發
      - 'generate-manifest.js'

  workflow_dispatch:          # 允許手動觸發

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 需要寫入權限才能 commit 回去

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 產生 doc-manifest.json
        run: node generate-manifest.js

      - name: Commit & Push（若有變更）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc-manifest.json
          git diff --cached --quiet || git commit -m "chore: 自動更新 doc-manifest.json"
          git push
