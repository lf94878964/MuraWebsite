<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>重新導向中…</title>
  <script>
    // GitHub Pages 不支援 SPA 路由，找不到的路徑都會落到這裡。
    // 這裡把原始網址（路徑 + 查詢 + hash）存起來，再導回對應的入口頁：
    //   /docs...  → docs.html（由 js/docs/app.js 讀取 __docs_redirect__ 決定顯示哪份文檔與章節）
    //   其他      → index.html（由 index.html 內嵌腳本還原網址，中控依路徑切換頁面）
    (function () {
      var path = location.pathname;
      var full = path + location.search + location.hash;
      try {
        if (path.indexOf('/docs') === 0) {
          sessionStorage.setItem('__docs_redirect__', full);
          location.replace('/docs.html');
        } else {
          sessionStorage.setItem('redirect', full);
          location.replace('/');
        }
      } catch (e) {
        location.replace(path.indexOf('/docs') === 0 ? '/docs.html' : '/');
      }
    })();
  </script>
</head>
<body style="margin:0;background:#000;color:#6e6e76;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;display:grid;place-items:center;min-height:100vh">
  <p>redirecting…</p>
</body>
</html>
