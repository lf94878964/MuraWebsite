<section class="page page-password">
  <div class="tk-wrap">
    <header class="tk-head">
      <p class="mono-label">TOOL / 09</p>
      <h1>密碼產生器</h1>
      <p class="tk-sub">用瀏覽器的密碼學安全亂數產生隨機密碼，可自訂長度（8～256）與字元種類，並即時評估強度。密碼只在你的裝置上產生，不會上傳或儲存。</p>
    </header>

    <div class="tk-stack">
      <section class="tk-card" aria-labelledby="pw-s1">
        <h2 id="pw-s1"><span class="tk-step">01</span>產生結果</h2>
        <div class="pw-out">
          <output id="pw-out" class="pw-text tk-mono" aria-live="polite"></output>
          <div class="tk-row">
            <button class="tk-chip on" id="pw-copy" type="button">複製密碼</button>
            <button class="tk-chip" id="pw-regen" type="button">重新產生</button>
            <button class="tk-chip" id="pw-show" type="button" aria-pressed="true">隱藏</button>
          </div>
        </div>
        <div class="pw-meter" aria-live="polite">
          <div class="pw-bar" role="progressbar" aria-label="密碼強度" aria-valuemin="0" aria-valuemax="100"><i id="pw-fill"></i></div>
          <p><b id="pw-level">—</b><span id="pw-detail"></span></p>
        </div>
        <p class="tk-hint">快捷鍵（焦點不在輸入框時）：<kbd>G</kbd> 重新產生　<kbd>C</kbd> 複製</p>
      </section>

      <section class="tk-card" aria-labelledby="pw-s2">
        <h2 id="pw-s2"><span class="tk-step">02</span>設定</h2>
        <div class="pw-len">
          <label class="fld"><span>長度</span>
            <span class="pw-lenrow"><input id="pw-range" type="range" min="8" max="256" value="20" /><input id="pw-num" type="number" min="8" max="256" value="20" inputmode="numeric" /></span></label>
          <div class="tk-row">
            <button class="tk-chip" type="button" data-len="12">12</button>
            <button class="tk-chip" type="button" data-len="16">16</button>
            <button class="tk-chip" type="button" data-len="20">20</button>
            <button class="tk-chip" type="button" data-len="32">32</button>
            <button class="tk-chip" type="button" data-len="64">64</button>
            <button class="tk-chip" type="button" data-len="128">128</button>
            <button class="tk-chip" type="button" data-len="256">256</button>
          </div>
        </div>
        <div class="pw-opts">
          <label class="pw-opt"><input type="checkbox" id="pw-upper" checked /><span>大寫字母 <small>A–Z</small></span></label>
          <label class="pw-opt"><input type="checkbox" id="pw-lower" checked /><span>小寫字母 <small>a–z</small></span></label>
          <label class="pw-opt"><input type="checkbox" id="pw-digit" checked /><span>數字 <small>0–9</small></span></label>
          <label class="pw-opt"><input type="checkbox" id="pw-sym" checked /><span>特殊符號 <small>!@#$%…</small></span></label>
        </div>
        <div class="pw-symbox" id="pw-symbox">
          <div class="pw-symhead">
            <span>允許的特殊符號<em id="pw-symcount"></em></span>
            <small>點符號切換可用／不可用（有些系統只允許特定符號）</small>
          </div>
          <div class="pw-syms" id="pw-syms" role="group" aria-label="允許的特殊符號"></div>
          <div class="tk-row">
            <button class="tk-chip" type="button" data-symset="default">預設</button>
            <button class="tk-chip" type="button" data-symset="common">常見安全　.!?#$_&amp;-</button>
            <button class="tk-chip" type="button" data-symset="simple">只用　- _ .</button>
            <button class="tk-chip" type="button" data-symset="all">全選</button>
            <button class="tk-chip" type="button" data-symset="none">全不選</button>
          </div>
          <label class="fld"><span>額外自訂符號<em>清單以外的符號（非英數字、不含空白），例如 ¥ € ©</em></span>
            <input id="pw-symset" type="text" autocomplete="off" spellcheck="false" placeholder="留空即可" /></label>
        </div>
        <details class="pw-adv">
          <summary>進階選項</summary>
          <label class="pw-opt"><input type="checkbox" id="pw-ambig" /><span>排除易混淆字元 <small>0 O o 1 l I |</small></span></label>
          <label class="pw-opt"><input type="checkbox" id="pw-each" checked /><span>每種勾選的類型至少出現一次</span></label>
          <label class="pw-opt"><input type="checkbox" id="pw-noleadsym" /><span>第一個字元不是符號 <small>部分系統不接受</small></span></label>
        </details>
        <p class="tk-bad" id="pw-err" role="alert"></p>
      </section>

      <section class="tk-card" aria-labelledby="pw-s3">
        <h2 id="pw-s3"><span class="tk-step">03</span>一次產生多組<small>方便挑選</small></h2>
        <div class="tk-list" id="pw-batch"></div>
        <div class="tk-row"><button class="tk-chip" id="pw-batch-regen" type="button">重新產生這 5 組</button></div>
      </section>
    </div>
  </div>
</section>
