<body>
  <div id="site-nav"></div>
  <main id="view" aria-live="polite" data-pre="qrscan"><section class="page page-qrscan">
  <div class="tk-wrap">
    <header class="tk-head">
      <p class="mono-label">TOOL / 08</p>
      <h1>QR Code掃描器</h1>
      <p class="tk-sub">用相機即時掃描，或上傳、拖放、貼上含 QR Code 的圖片來取出內容與連結。影像只在你的瀏覽器內處理，不會上傳到任何伺服器。掃描到的連結不會自動開啟，由你確認後再前往。</p>
    </header>

    <div class="tk-stack">
      <section class="tk-card" aria-labelledby="qs-s1">
        <h2 id="qs-s1"><span class="tk-step">01</span>相機掃描<small>需要相機權限</small></h2>
        <div class="qs-cam" id="qs-cam" data-state="off">
          <video id="qs-video" playsinline muted></video>
          <div class="qs-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <p class="qs-ph" id="qs-ph">相機尚未開啟</p>
        </div>
        <div class="tk-row">
          <button class="tk-chip on" id="qs-start" type="button">開啟相機</button>
          <button class="tk-chip" id="qs-stop" type="button" disabled>關閉相機</button>
          <select id="qs-dev" aria-label="選擇相機" hidden></select>
          <label class="qs-chk"><input type="checkbox" id="qs-cont" /><span>連續掃描</span></label>
        </div>
        <p class="tk-bad" id="qs-err" role="alert"></p>
      </section>

      <section class="tk-card" aria-labelledby="qs-s2">
        <h2 id="qs-s2"><span class="tk-step">02</span>上傳圖片<small>可多選、拖放或直接貼上（Ctrl+V）</small></h2>
        <label class="qs-drop" id="qs-drop" tabindex="0">
          <input id="qs-file" type="file" accept="image/*" multiple hidden />
          <b>點此選擇圖片</b><span>或把圖片拖到這裡，也可以直接貼上截圖</span>
        </label>
      </section>

      <section class="tk-card" aria-labelledby="qs-s3">
        <h2 id="qs-s3"><span class="tk-step">03</span>掃描結果<small id="qs-count"></small></h2>
        <div id="qs-results" class="qs-results" aria-live="polite"><p class="tk-hint" id="qs-none">還沒有結果。開啟相機或上傳圖片後會顯示在這裡。</p></div>
        <div class="tk-row"><button class="tk-chip danger" id="qs-clear" type="button" disabled>清除全部</button></div>
        <p class="tk-hint">安全提醒：QR Code 可能指向釣魚或惡意網站。開啟前請確認網域；看到 <code>xn--</code> 開頭的網域要特別小心（可能是外觀相似的假網站）。</p>
      </section>
    </div>
  </div>
</section>
</main>
