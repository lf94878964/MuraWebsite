<body>
  <div id="site-nav"></div>
  <main id="view" aria-live="polite" data-pre="calculator"><section class="page page-calculator">
  <div class="calc-wrap">
    <header class="calc-head">
      <p class="mono-label">TOOL / 01</p>
      <h1>數學計算機</h1>
      <p class="calc-sub">與機器人 <code>/計算機</code> 指令使用同一個 SymPy 引擎：支援純量、向量、矩陣，以及極限、積分、級數、數論與統計函數，並附上詳細計算步驟。所有計算都在你的瀏覽器內完成，不會上傳任何資料。</p>
    </header>

    <div class="calc-grid">
      <div class="calc-main">
        <section class="calc-card" aria-labelledby="calc-s1">
          <h2 id="calc-s1"><span class="calc-step">01</span>輸入算式</h2>
          <form id="calc-form" class="calc-form" autocomplete="off">
            <label class="fld"><span>算式</span>
              <input id="calc-in" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go"
                placeholder="例如 sin(30)+2^2、[1,2,3]+[4,5,6]、lim (x→0) sin(x)/x" maxlength="400" /></label>
            <div class="calc-keys" id="calc-keys" role="group" aria-label="常用符號"></div>
            <div class="calc-opts">
              <label class="fld"><span>模式</span>
                <select id="calc-mode">
                  <option value="">自動偵測</option>
                  <option value="scalar">純量</option>
                  <option value="vector">向量</option>
                  <option value="matrix">矩陣</option>
                  <option value="determinant">行列式</option>
                  <option value="permanent">積和式</option>
                  <option value="diagonal">對角線</option>
                </select></label>
              <label class="fld"><span>角度單位</span>
                <select id="calc-angle">
                  <option value="radian">弧度</option>
                  <option value="degree">角度</option>
                </select></label>
            </div>
            <label class="fld" id="calc-vars-wrap" hidden><span>替換值<em>算式中的 ? 會依序換成這些值，用逗號分隔</em></span>
              <input id="calc-vars" type="text" spellcheck="false" placeholder="例如 1,4,5" maxlength="200" /></label>
            <div class="calc-actions">
              <button class="btn btn-primary" id="calc-go" type="submit">計算</button>
              <button class="btn btn-glass" id="calc-clear" type="button">清除</button>
              <a class="btn btn-glass" href="/docs/11-%E8%A8%88%E7%AE%97%E6%A9%9F/1-%E8%A8%88%E7%AE%97%E6%A9%9F">使用教學</a>
              <span class="calc-engine" id="calc-engine" aria-live="polite"></span>
            </div>
          </form>
          <p class="calc-hint">提示：輸入含 <code>[ ]</code> 會自動切成向量／矩陣；行列式、積和式、對角線請在「模式」選擇後直接輸入矩陣。微積分裡請寫 <code>6*x^2</code>，不要寫 <code>6x^2</code>。</p>
        </section>

        <section class="calc-card" id="calc-result-card" aria-labelledby="calc-s2" hidden>
          <h2 id="calc-s2"><span class="calc-step">02</span>計算結果</h2>
          <div id="calc-result" aria-live="polite"></div>
        </section>
      </div>

      <aside class="calc-ref" aria-labelledby="calc-ref-h">
        <div class="calc-ref-head">
          <h2 id="calc-ref-h">可用函數<small id="calc-ref-count"></small></h2>
          <p>點一下範例就會帶入並計算；右側的 ＋ 只把函數名稱插入輸入欄。</p>
          <input id="calc-ref-q" type="search" autocomplete="off" spellcheck="false" placeholder="搜尋函數：sin、階乘、質數、矩陣…" />
        </div>
        <div class="calc-ref-list" id="calc-ref-list"></div>
      </aside>
    </div>
  </div>
</section>
</main>
