<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>千恋＊万花機器人</title>
  <link rel="icon" type="image/png" href="https://images-ext-1.discordapp.net/external/qedYzKKm-vM-qF5sOOs411o40ZRV7iJqPh6niCeSyFo/%3Fsize%3D1024/https/cdn.discordapp.com/avatars/1379034361579438161/415a24c2ad4b19048f120dd9089e55f4.png?format=webp&quality=lossless" />
  <script>
    (function () {
      // 1. 套用主題（放在最前面，避免閃白）
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
      // 2. 還原 404.html 暫存的原始路徑
      try {
        var r = sessionStorage.getItem('redirect');
        if (r) { history.replaceState(null, '', r); sessionStorage.removeItem('redirect'); }
      } catch (e) {}
      // 3. 彩蛋路徑
      var p = location.pathname.replace(/\/+$/, '');
      if (p === '/ciallo') location.replace('https://youtu.be/QDia3e12czc?si=6RTzTQ9GuPi5nXlQ');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main id="view" aria-live="polite"></main>
  <div id="site-footer"></div>
  <noscript><p style="padding:6rem 1.5rem;text-align:center">此網站需要啟用 JavaScript。</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
